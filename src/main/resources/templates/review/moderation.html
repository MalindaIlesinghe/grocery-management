<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Review Moderation</title>
<main>
    <div class="container mt-4">
        <h2 class="mb-4">Review Moderation Panel</h2>

        <div th:if="${param.moderated}" class="alert alert-success">Review status updated.</div>
        <div th:if="${param.deleted}"   class="alert alert-warning">Review deleted.</div>

        <!-- Pending reviews section -->
        <h5 class="mb-3">
            Pending Reviews
            <span class="badge bg-warning text-dark ms-2"
                  th:text="${#lists.size(pendingReviews)}"></span>
        </h5>

        <div th:if="${#lists.isEmpty(pendingReviews)}"
             class="alert alert-success mb-4">
            No reviews awaiting moderation.
        </div>

        <div th:each="r : ${pendingReviews}" class="card mb-3 border-warning">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <strong th:text="${r.username}"></strong>
                        <span class="text-muted small ms-2"
                              th:text="'on ' + ${r.productName}"></span>
                        <span th:class="'badge ms-2 ' + ${r.badgeStyle}"
                              th:text="${r.displayLabel}"></span>
                    </div>
                    <span class="text-warning" th:text="${r.stars}"></span>
                </div>

                <p class="mt-2 mb-3" th:text="${r.comment}"></p>

                <!-- Approve / Reject buttons -->
                <div class="d-flex gap-2">
                    <form th:action="@{/review/moderate}" method="post">
                        <input type="hidden" name="id"     th:value="${r.id}">
                        <input type="hidden" name="status" value="APPROVED">
                        <button type="submit" class="btn btn-sm btn-success">Approve</button>
                    </form>
                    <form th:action="@{/review/moderate}" method="post">
                        <input type="hidden" name="id"     th:value="${r.id}">
                        <input type="hidden" name="status" value="REJECTED">
                        <button type="submit" class="btn btn-sm btn-danger">Reject</button>
                    </form>
                    <form th:action="@{/review/delete}" method="post"
                          onsubmit="return confirm('Permanently delete this review?')">
                        <input type="hidden" name="id" th:value="${r.id}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>

        <hr>

        <!-- All reviews table -->
        <h5 class="mt-4 mb-3">All Reviews</h5>
        <table class="table table-bordered table-sm table-hover">
            <thead class="table-dark">
            <tr>
                <th>User</th>
                <th>Product</th>
                <th>Rating</th>
                <th>Type</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${allReviews}">
                <td th:text="${r.username}"></td>
                <td th:text="${r.productName}"></td>
                <td class="text-warning" th:text="${r.stars}"></td>
                <td>
            <span th:class="'badge ' + ${r.badgeStyle}"
                  th:text="${r.displayLabel}"></span>
                </td>
                <td>
            <span th:class="${r.status == 'APPROVED'} ? 'badge bg-success' :
                             (r.status == 'REJECTED') ? 'badge bg-danger'  :
                                                        'badge bg-warning text-dark'"
                  th:text="${r.status}">
            </span>
                </td>
                <td th:text="${r.reviewDate}" class="small"></td>
                <td>
                    <form th:action="@{/review/delete}" method="post"
                          onsubmit="return confirm('Delete this review?')">
                        <input type="hidden" name="id" th:value="${r.id}">
                        <button class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(allReviews)}">
                <td colspan="7" class="text-center text-muted">No reviews yet.</td>
            </tr>
            </tbody>
        </table>

    </div>
</main>
</html>
