<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Admin List</title>
<main>
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Admin Accounts</h2>
            <a th:href="@{/admin/register}" class="btn btn-dark">+ New Admin</a>
        </div>

        <div th:if="${param.added}"      class="alert alert-success">Admin registered.</div>
        <div th:if="${param.deleted}"    class="alert alert-warning">Admin deleted.</div>
        <div th:if="${param.toggled}"    class="alert alert-info">Admin status toggled.</div>
        <div th:if="${param.updated}"    class="alert alert-success">Admin level updated.</div>
        <div th:if="${param.selfDelete}" class="alert alert-danger">You cannot delete your own account.</div>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Level</th>
                <th>Last Login</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${admins}">
                <td th:text="${a.id}" class="small"></td>
                <td th:text="${a.username}"></td>
                <td th:text="${a.email}"></td>

                <!-- Change level inline -->
                <td>
                    <form th:action="@{/admin/level}" method="post" style="display:inline">
                        <input type="hidden" name="id" th:value="${a.id}">
                        <select name="adminLevel" class="form-select form-select-sm d-inline-block w-auto"
                                onchange="this.form.submit()">
                            <option value="STAFF"   th:selected="${a.adminLevel == 'STAFF'}">Staff</option>
                            <option value="MANAGER" th:selected="${a.adminLevel == 'MANAGER'}">Manager</option>
                            <option value="SUPER"   th:selected="${a.adminLevel == 'SUPER'}">Super</option>
                        </select>
                    </form>
                </td>

                <td th:text="${a.lastLogin}" class="small"></td>

                <td>
            <span th:class="${a.active} ? 'badge bg-success' : 'badge bg-secondary'"
                  th:text="${a.active} ? 'Active' : 'Inactive'">
            </span>
                </td>

                <td>
                    <!-- Toggle active/inactive -->
                    <form th:action="@{/admin/toggle}" method="post" style="display:inline">
                        <input type="hidden" name="id" th:value="${a.id}">
                        <button type="submit"
                                th:class="${a.active} ? 'btn btn-sm btn-outline-warning' : 'btn btn-sm btn-outline-success'"
                                th:text="${a.active} ? 'Deactivate' : 'Activate'">
                        </button>
                    </form>

                    <!-- Delete -->
                    <form th:action="@{/admin/delete}" method="post"
                          style="display:inline"
                          onsubmit="return confirm('Delete this admin?')">
                        <input type="hidden" name="id" th:value="${a.id}">
                        <button type="submit" class="btn btn-sm btn-outline-danger ms-1">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(admins)}">
                <td colspan="7" class="text-center text-muted">No admin accounts found.</td>
            </tr>
            </tbody>
        </table>

        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">
            Back to Dashboard
        </a>
    </div>
</main>
</html>
