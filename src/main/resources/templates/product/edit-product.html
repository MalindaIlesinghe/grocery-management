<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
</head>
<h1>Edit Product</h1>

<form action="/product/update" method="post">

    <table>

        <tr>
            <td>Product Name</td>
            <td>
                <input type="text" name="name">
            </td>
        </tr>

        <tr>
            <td>Description</td>
            <td>
                <textarea name="description"></textarea>
            </td>
        </tr>

        <tr>
            <td>Price (Rs.)</td>
            <td>
                <input type="number" name="price">
            </td>
        </tr>

        <tr>
            <td>Stock (units)</td>
            <td>
                <input type="number" name="stock">
            </td>
        </tr>

        <tr>
            <td>Category</td>
            <td>
                <input type="text" name="category">
            </td>
        </tr>

        <tr>
            <td>Image URL (optional)</td>
            <td>
                <input type="text" name="imageUrl">
            </td>
        </tr>

        <tr>
            <td colspan="2">

                <button type="submit">
                    Save Changes
                </button>

                <button type="reset">
                    Cancel
                </button>

            </td>
        </tr>

    </table>

</form>

</body>
</html>
