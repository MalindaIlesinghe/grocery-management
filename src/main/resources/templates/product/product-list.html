<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Products</title>
<main>
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Grocery Products</h2>
            <!-- Only admins see the Add button -->
            <a th:href="@{/product/add}" class="btn btn-success"
               th:if="${session.loggedInUser != null and session.loggedInUser.role == 'ADMIN'}">
                + Add Product
            </a>
        </div>

        <!-- Alerts -->
        <div th:if="${param.added}"   class="alert alert-success">Product added successfully.</div>
        <div th:if="${param.updated}" class="alert alert-success">Product updated successfully.</div>
        <div th:if="${param.deleted}" class="alert alert-warning">Product deleted.</div>

        <!-- Filter by category + keyword search -->
        <form th:action="@{/product/list}" method="get" class="row g-2 mb-4">
            <div class="col-md-5">
                <input type="text" name="keyword" class="form-control"
                       placeholder="Search by name or description..."
                       th:value="${keyword}">
            </div>
            <div class="col-md-4">
                <select name="category" class="form-select">
                    <option value="">All Categories</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat}"
                            th:text="${cat}"
                            th:selected="${cat == selectedCategory}">
                    </option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">Filter</button>
            </div>
        </form>

        <!-- Product grid -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="p : ${products}">
                <div class="card h-100">
                    <div class="card-body">
                        <span class="badge bg-secondary mb-2" th:text="${p.category}"></span>
                        <h5 class="card-title" th:text="${p.name}"></h5>
                        <p class="card-text text-muted small" th:text="${p.description}"></p>
                        <p class="fw-bold text-success" th:text="'Rs. ' + ${p.price}"></p>
                        <p class="small">
                            Stock:
                            <span th:class="${p.stock > 0} ? 'text-success' : 'text-danger'"
                                  th:text="${p.stock > 0} ? ${p.stock} + ' units' : 'Out of stock'">
              </span>
                        </p>
                    </div>
                    <div class="card-footer d-flex gap-2">
                        <!-- Admin actions -->
                        <th:block th:if="${session.loggedInUser != null and session.loggedInUser.role == 'ADMIN'}">
                            <a th:href="@{/product/edit(id=${p.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <form th:action="@{/product/delete}" method="post"
                                  onsubmit="return confirm('Delete this product?')">
                                <input type="hidden" name="id" th:value="${p.id}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(products)}" class="text-center text-muted mt-5">
            <p>No products found.</p>
        </div>

    </div>
</main>
</html>
