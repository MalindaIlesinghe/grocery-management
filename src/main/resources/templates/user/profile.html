<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>My Profile</title>
<main>
    <div class="container mt-4" style="max-width: 540px;">
        <h2 class="mb-4">My Profile</h2>

        <div th:if="${param.updated}" class="alert alert-success">Profile updated successfully.</div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/user/update}" method="post">
            <!-- Hidden: carry ID through the form -->
            <input type="hidden" name="id" th:value="${user.id}">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <!-- Username is read-only — cannot be changed -->
                <input type="text" class="form-control" th:value="${user.username}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" th:value="${user.email}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" th:value="${user.phone}">
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="2" th:text="${user.address}"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/user/logout}" class="btn btn-outline-secondary">Logout</a>
            </div>
        </form>

        <!-- Delete account (separate form, POST for safety) -->
        <hr class="mt-4">
        <form th:action="@{/user/delete}" method="post"
              onsubmit="return confirm('Are you sure? This cannot be undone.')">
            <input type="hidden" name="id" th:value="${user.id}">
            <button type="submit" class="btn btn-outline-danger btn-sm">Delete My Account</button>
        </form>
    </div>
</main>
</html>
