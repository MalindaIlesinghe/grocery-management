<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Login</title>
<main>
    <div class="container mt-5" style="max-width: 420px;">
        <h2 class="mb-4">Login</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${param.registered}" class="alert alert-success">Account created! Please log in.</div>
        <div th:if="${param.deleted}" class="alert alert-info">Your account has been deleted.</div>

        <form th:action="@{/user/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <p class="mt-3 text-center">
            No account? <a th:href="@{/user/register}">Register here</a>
        </p>
    </div>
</main>
</html>
