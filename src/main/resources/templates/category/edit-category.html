<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Edit Category</title>
<main>
    <div class="container mt-4" style="max-width: 520px;">
        <h2 class="mb-4">Edit Category</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/category/edit}" method="post">
            <input type="hidden" name="id" th:value="${category.id}">

            <div class="mb-3">
                <label class="form-label">Category Name</label>
                <input type="text" name="name" class="form-control"
                       th:value="${category.name}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control"
                          rows="2" th:text="${category.description}"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Image URL <span class="text-muted">(optional)</span></label>
                <input type="text" name="imageUrl" class="form-control"
                       th:value="${category.imageUrl}">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/category/list}" class="btn btn-outline-secondary">Cancel</a>
            </div>

        </form>
    </div>
</main>
</html>
