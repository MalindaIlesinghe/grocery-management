<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Add Category</title>
<main>
    <div class="container mt-4" style="max-width: 520px;">
        <h2 class="mb-4">Add New Category</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/category/add}" method="post">

            <div class="mb-3">
                <label class="form-label">Category Name</label>
                <input type="text" name="name" class="form-control"
                       placeholder="e.g. Fruits, Dairy, Vegetables" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control"
                          rows="2" placeholder="Short description of this category"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Image URL <span class="text-muted">(optional)</span></label>
                <input type="text" name="imageUrl" class="form-control"
                       placeholder="https://example.com/image.jpg">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Add Category</button>
                <a th:href="@{/category/list}" class="btn btn-outline-secondary">Cancel</a>
            </div>

        </form>
    </div>
</main>
</html>
