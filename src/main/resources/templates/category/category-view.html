<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title th:text="${category.name}">Category</title>
<main>
    <div class="container mt-4">

        <!-- Category header -->
        <div class="mb-4">
            <a th:href="@{/category/list}" class="btn btn-outline-secondary btn-sm mb-2">
                Back to Categories
            </a>
            <h2 th:text="${category.name}"></h2>
            <p class="text-muted" th:text="${category.description}"></p>
        </div>

        <!-- Products in this category -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="p : ${products}">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${p.name}"></h5>
                        <p class="card-text text-muted small" th:text="${p.description}"></p>
                        <p class="fw-bold text-success" th:text="'Rs. ' + ${p.price}"></p>
                        <p class="small">
                            Stock:
                            <span th:class="${p.stock > 0} ? 'text-success' : 'text-danger'"
                                  th:text="${p.stock > 0} ? ${p.stock} + ' units' : 'Out of stock'">
              </span>
                        </p>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/order/place(productId=${p.id})}"
                           class="btn btn-sm btn-success"
                           th:if="${p.stock > 0}">
                            Order Now
                        </a>
                        <span th:if="${p.stock == 0}"
                              class="text-danger small">Unavailable</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(products)}" class="text-center text-muted mt-5">
            <p>No products in this category yet.</p>
            <a th:href="@{/product/add}"
               th:if="${session.loggedInUser != null and session.loggedInUser.role == 'ADMIN'}"
               class="btn btn-outline-success btn-sm">Add a Product</a>
        </div>

    </div>
</main>
</html>
