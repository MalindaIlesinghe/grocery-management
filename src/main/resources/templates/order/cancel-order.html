<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Cancel Order</title>
<main>
    <div class="container mt-5" style="max-width: 460px; text-align: center;">
        <div class="card border-warning">
            <div class="card-body">
                <h4 class="card-title text-warning">Cancel Order</h4>
                <p class="card-text">
                    Are you sure you want to cancel order
                    <strong th:text="${order.id}"></strong>
                    for <strong th:text="${order.productName}"></strong>?
                </p>
                <p class="text-muted small">Stock will be restored automatically.</p>

                <div class="d-flex justify-content-center gap-3 mt-3">
                    <form th:action="@{/order/cancel}" method="post">
                        <input type="hidden" name="id" th:value="${order.id}">
                        <button type="submit" class="btn btn-warning">Yes, Cancel</button>
                    </form>
                    <a th:href="@{/order/list}" class="btn btn-outline-secondary">Go Back</a>
                </div>
            </div>
        </div>
    </div>
</main>
</html>
