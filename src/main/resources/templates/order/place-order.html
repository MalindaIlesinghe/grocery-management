<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Place Order</title>
<main>
    <div class="container mt-4" style="max-width: 520px;">
        <h2 class="mb-4">Place an Order</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/order/place}" method="post">

            <div class="mb-3">
                <label class="form-label">Select Product</label>
                <select name="productId" class="form-select" required>
                    <option value="">-- Choose a product --</option>
                    <option th:each="p : ${products}"
                            th:value="${p.id}"
                            th:text="${p.name} + ' — Rs. ' + ${p.price} + ' (' + ${p.stock} + ' left)'"
                            th:selected="${selectedProduct != null and selectedProduct.id == p.id}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" name="quantity" class="form-control"
                       min="1" value="1" required>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Place Order</button>
                <a th:href="@{/order/list}" class="btn btn-outline-secondary">My Orders</a>
            </div>

        </form>
    </div>
</main>
</html>
