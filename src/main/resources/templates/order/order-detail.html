<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<title>Order Detail</title>
<main>
  <div class="container mt-4" style="max-width: 540px;">
    <h2 class="mb-4">Order Details</h2>

    <div th:if="${param.error == 'cannotCancel'}"
         class="alert alert-danger">
      Only pending orders can be cancelled.
    </div>

    <div class="card">
      <div class="card-body">
        <table class="table table-borderless mb-0">
          <tr>
            <th>Order ID</th>
            <td th:text="${order.id}"></td>
          </tr>
          <tr>
            <th>Product</th>
            <td th:text="${order.productName}"></td>
          </tr>
          <tr>
            <th>Quantity</th>
            <td th:text="${order.quantity}"></td>
          </tr>
          <tr>
            <th>Total Price</th>
            <td th:text="'Rs. ' + ${order.totalPrice}"></td>
          </tr>
          <tr>
            <th>Order Date</th>
            <td th:text="${order.orderDate}"></td>
          </tr>
          <tr>
            <th>Status</th>
            <td>
              <span th:if="${order.status == 'PENDING'}"   class="badge bg-warning text-dark">PENDING</span>
              <span th:if="${order.status == 'CONFIRMED'}" class="badge bg-info text-dark">CONFIRMED</span>
              <span th:if="${order.status == 'DELIVERED'}" class="badge bg-success">DELIVERED</span>
              <span th:if="${order.status == 'CANCELLED'}" class="badge bg-danger">CANCELLED</span>
            </td>
          </tr>
        </table>
      </div>
    </div>

    <div class="d-flex gap-2 mt-3">
      <a th:href="@{/order/list}" class="btn btn-outline-secondary">Back to Orders</a>

      <!-- Cancel button — only for pending orders -->
      <form th:if="${order.isPending()}"
            th:action="@{/order/cancel}" method="post"
            onsubmit="return confirm('Are you sure you want to cancel?')">
        <input type="hidden" name="id" th:value="${order.id}">
        <button type="submit" class="btn btn-warning">Cancel Order</button>
      </form>
    </div>

  </div>
</main>
</html>
